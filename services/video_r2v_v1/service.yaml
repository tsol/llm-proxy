id: video_r2v_v1
title: "Reference to video (Wan2GP r2v)"
description: "videogen/r2v.sh via scheduler."
version: "1.0.0"
kind: exec
entry: ["python3", "run.py"]
timeout_sec: 7200
residents: { requires: [], evicts: ["*"] }
resources: { vram_mb: 7600, ram_mb: 20000, cpu: 4, min_free_vram_mb: 3500 }
estimate: { duration_sec: 1200 }
priority_default: normal
input_schema:
  type: object
  required: [prompt, image_paths]
  additionalProperties: false
  properties:
    prompt: { type: string }
    image_paths: { type: array, items: { type: string }, minItems: 1 }
    cutout: { type: boolean, default: false }
    resolution: { type: string }
    seed: { type: integer }
mcp: { expose: true, default_wait_sec: 7200 }
