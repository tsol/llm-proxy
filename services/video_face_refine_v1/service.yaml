id: video_face_refine_v1
title: "Face refine (WanGP)"
description: "Restore face detail in an existing clip via videogen/face_refine.sh. Returns a job id immediately; poll job_status."
version: "1.0.0"
kind: exec
entry: ["python3", "run.py"]
timeout_sec: 7200
residents: { requires: [], evicts: ["*"] }
resources: { vram_mb: 7200, ram_mb: 20000, cpu: 4, min_free_vram_mb: 3000 }
estimate: { duration_sec: 900 }
priority_default: normal
input_schema:
  type: object
  required: [video_path]
  additionalProperties: false
  properties:
    video_path: { type: string, minLength: 1 }
    prompt: { type: string }
    quality: { type: string, enum: [light, normal, strong] }
    strength: { type: number }
    faces: { type: integer }
    ref_image_path: { type: string }
    seed: { type: integer }
mcp: { expose: true, default_wait_sec: 0 }
