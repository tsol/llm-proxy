<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Proxy Queue</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#111; color:#ccc; font:13px/1.6 monospace; padding:14px }
  h1 { font-size:14px; color:#7ec8e3; margin-bottom:8px }
  #ts { color:#666; float:right }
  .section { color:#7ec8e3; margin-top:10px; border-top:1px solid #333; padding-top:6px; margin-bottom:4px }
  .item { padding-left:20px }
  .stat { padding-left:20px; color:#888 }
  .waiter { padding-left:40px; color:#e06060 }
  .bar-on { color:#4ecdc4 }
  .bar-off { color:#333 }
  .ok { color:#6f6 }
  .err { color:#f66 }
  .dim { color:#555 }
  .stale { color:#555 }
</style>
</head>
<body>
<h1>LLM Proxy Queue <span id="ts"></span></h1>
<pre id="root">loading...</pre>
<script>
const API = '/v1/router/queue';
const root = document.getElementById('root');
const ts = document.getElementById('ts');

function bar(a, l) {
  if (l <= 0) return '<span class="dim">-</span>';
  let b = '[';
  for (let i = 0; i < l; i++) b += (i < a ? '<span class="bar-on">█</span>' : '<span class="bar-off">░</span>');
  return b + ']';
}

function preview(first, last) {
  if (!last) return esc(first);
  return esc(first) + ' ... ' + esc(last);
}

function stat(k, stats) {
  const s = stats[k];
  if (!s || !s.total) return '';
  const cls = s.lastStatus < 400 ? 'ok' : 'err';
  return '<span class="' + cls + '"> ok=' + s.ok + ' fail=' + s.fail + ' last=' + s.lastStatus + ' total=' + s.total + '</span>';
}

async function tick() {
  try {
    const r = await fetch(API);
    const d = await r.json();
    ts.textContent = new Date().toLocaleTimeString('ru-RU', { hour12: false });

    const stats = d.stats || {};
    const recent = d.recent || [];
    const lines = [];

    // ── 1. ALL MODELS (from stats, enriched with last request from recent) ──
    const modelKeys = Object.keys(stats).sort();
    if (modelKeys.length) {
      lines.push('<span class="section">── models (' + modelKeys.length + ') ──</span>');
      for (const k of modelKeys) {
        const s = stats[k];
        // Find last request for this model in recent
        const lastR = recent.find(r => r.key === k);
        const cls = s.lastStatus < 400 ? 'ok' : 'err';
        let line = '<span class="item ' + cls + '">' + esc(k) + '  ok=' + s.ok + ' fail=' + s.fail + ' last=' + s.lastStatus + ' total=' + s.total;
        if (lastR) {
          line += '  ' + preview(lastR.reqPreview, lastR.respPreview);
        }
        line += '</span>';
        lines.push(line);
      }
    }

    // ── 2. QUEUES (alias chain with groups) ──
    const gc = d.groupConfig || [];
    if (gc.length) {
      lines.push('');
      lines.push('<span class="section">── alias kimi chain (' + gc.length + ') ──</span>');

      // Group by group index
      const byGroup = {};
      for (const m of gc) {
        const gk = m.group;
        if (!byGroup[gk]) byGroup[gk] = { strategy: m.strategy, members: [] };
        byGroup[gk].members.push(m);
      }
      for (const gk of Object.keys(byGroup).sort()) {
        const grp = byGroup[gk];
        const isGroup = grp.strategy === 'random';
        lines.push('<span class="dim">  ' + grp.strategy + ' (' + grp.members.length + ')' + (isGroup ? ' [G]' : '') + '</span>');
        for (const m of grp.members) {
          const k = m.provider + ':' + m.model;
          const st = stat(k, stats);
          let act = 0;
          for (const ag of d.aliasGroups||[]) {
            for (const gm of ag.members||[]) {
              if (gm.provider === m.provider && gm.model === m.model) { act = gm.active; break; }
            }
          }
          const s = st ? st.replace(/<[^>]*>/g,'').trim() : '';
          if (isGroup && m.limit > 0) {
            lines.push('<span class="item">' + esc(m.provider + '/' + m.model) + ' ' + bar(act, m.limit) + ' ' + act + '/' + m.limit + '  ' + s + '</span>');
          } else {
            lines.push('<span class="item stale">' + esc(m.provider + '/' + m.model) + '  -  ' + s + '</span>');
          }
        }
      }
    }
    // ── 3. LIVE CONNECTIONS ──
    const incoming = d.incoming || [];
    const active = d.active || [];
    lines.push('');
    lines.push('<span class="section">── live ──</span>');
    if (incoming.length) {
      lines.push('<span class="dim">  incoming (' + incoming.length + ')</span>');
      for (const a of incoming) {
        const dur = Math.round((Date.now() - a.startedAt) / 1000);
        const cls = dur > 60 ? 'stale' : '';
        lines.push('<span class="item ' + cls + '">  ' + dur + 's  ' + esc(a.preview) + '</span>');
      }
    } else {
      lines.push('<span class="dim">  incoming (0)</span>');
    }
    if (active.length) {
      lines.push('<span class="dim">  outgoing (' + active.length + ')</span>');
      for (const a of active) {
        const dur = Math.round((Date.now() - a.startedAt) / 1000);
        const cls = dur > 60 ? 'stale' : 'bar-on';
        lines.push('<span class="item ' + cls + '">' + esc(a.provider + '/' + a.model) + '  ' + dur + 's  ' + preview(a.reqPreview, a.reqSuffix) + '</span>');
      }
    } else {
      lines.push('<span class="dim">  outgoing (0)</span>');
    }

    // ── 4. RECENT 10 ──
    if (recent.length) {
      lines.push('');
      lines.push('<span class="section">── recent ' + Math.min(recent.length, 10) + '/' + recent.length + ' ──</span>');
      for (let i = 0; i < Math.min(recent.length, 10); i++) {
        const r = recent[i];
        const cls = r.status < 400 ? 'ok' : 'err';
        const dur = Math.round((Date.now() - r.startedAt) / 1000);
        const stale = dur > 60 ? ' stale' : '';
        lines.push('<span class="item ' + cls + stale + '">' + esc(r.provider + '/' + r.model)
          + '  ' + r.status + '  ' + dur + 's  '
          + preview(r.reqPreview, r.respPreview) + '</span>');
      }
    }

    root.innerHTML = lines.length ? lines.join('\n') : '<span class="dim">(no activity)</span>';
  } catch(e) {
    root.innerHTML = '<span class="err">proxy unreachable</span>';
  }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\s+/g, ' ');
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
