<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Proxy Queue</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#111; color:#ccc; font:13px/1.6 monospace; padding:14px }
  h1 { font-size:14px; color:#7ec8e3; margin-bottom:8px }
  #ts { color:#666; float:right }
  .section { color:#7ec8e3; margin-top:10px; border-top:1px solid #333; padding-top:6px; margin-bottom:4px }
  .item { padding-left:20px }
  .stat { padding-left:20px; color:#888 }
  .waiter { padding-left:40px; color:#e06060 }
  .bar-on { color:#4ecdc4 }
  .bar-off { color:#333 }
  .ok { color:#6f6 }
  .err { color:#f66 }
  .dim { color:#555 }
</style>
</head>
<body>
<h1>LLM Proxy Queue <span id="ts"></span></h1>
<pre id="root">loading...</pre>
<script>
const API = '/v1/router/queue';
const root = document.getElementById('root');
const ts = document.getElementById('ts');

function bar(a, l) {
  if (l <= 0) return '<span class="dim">-</span>';
  let b = '[';
  for (let i = 0; i < l; i++) b += (i < a ? '<span class="bar-on">█</span>' : '<span class="bar-off">░</span>');
  return b + ']';
}

function stat(k, stats) {
  const s = stats[k];
  if (!s || !s.total) return '';
  const cls = s.lastStatus < 400 ? 'ok' : 'err';
  return '<span class="' + cls + '"> ok=' + s.ok + ' fail=' + s.fail + ' last=' + s.lastStatus + ' total=' + s.total + '</span>';
}

async function tick() {
  try {
    const r = await fetch(API);
    const d = await r.json();
    ts.textContent = new Date().toLocaleTimeString('ru-RU', { hour12: false });

    const stats = d.stats || {};
    const recent = d.recent || [];
    const lines = [];

    // ── 1. ALL MODELS (from stats, enriched with last request from recent) ──
    const modelKeys = Object.keys(stats).sort();
    if (modelKeys.length) {
      lines.push('<span class="section">── models (' + modelKeys.length + ') ──</span>');
      for (const k of modelKeys) {
        const s = stats[k];
        // Find last request for this model in recent
        const lastR = recent.find(r => r.key === k);
        const cls = s.lastStatus < 400 ? 'ok' : 'err';
        let line = '<span class="item ' + cls + '">' + esc(k) + '  ok=' + s.ok + ' fail=' + s.fail + ' last=' + s.lastStatus + ' total=' + s.total;
        if (lastR) {
          line += '  ' + esc(lastR.reqPreview.slice(0, 40)) + ' ... ' + esc(lastR.respPreview.slice(-40));
        }
        line += '</span>';
        lines.push(line);
      }
    }

    // ── 2. QUEUES (group config + per-model queues) ──
    const gc = d.groupConfig || [];
    if (gc.length) {
      lines.push('');
      lines.push('<span class="section">── preferred group (' + gc.length + ') ──</span>');
      for (const m of gc) {
        const k = m.provider + ':' + m.model;
        const st = stat(k, stats);
        let act = 0;
        for (const g of d.groups||[]) for (const gm of g.members||[]) {
          if (gm.provider === m.provider && gm.model === m.model) { act = gm.active; break; }
        }
        lines.push('<span class="item">' + esc(m.provider + '/' + m.model) + ' ' + bar(act, m.limit) + ' ' + act + '/' + m.limit + '  ' + (st ? st.replace(/<[^>]*>/g,'').trim() : '') + '</span>');
      }
    }
    for (const m of d.perModel || []) {
      lines.push('<span class="item">' + esc(m.key) + ' ' + bar(m.active, m.limit) + ' ' + m.active + '/' + m.limit + ' w=' + m.waiters.length + '</span>');
      const st = stat(m.key, stats);
      if (st) lines.push(st);
      for (let i = 0; i < m.waiters.length; i++)
        lines.push('<span class="waiter">#' + (i+1) + ' "' + esc((m.waiters[i].preview||'').slice(0,60)) + '"</span>');
    }
    for (const g of d.groups || []) {
      lines.push('<span class="item">' + esc(g.key) + ' ' + bar(g.active, g.limit) + ' ' + g.active + '/' + g.limit + ' w=' + g.waiters.length + '</span>');
      for (let i = 0; i < g.waiters.length; i++)
        lines.push('<span class="waiter">#' + (i+1) + ' "' + esc((g.waiters[i].preview||'').slice(0,60)) + '"</span>');
    }

    // ── 3. LIVE CONNECTIONS ──
    const active = d.active || [];
    if (active.length) {
      lines.push('');
      lines.push('<span class="section">── live (' + active.length + ') ──</span>');
      for (const a of active) {
        const dur = Math.round((Date.now() - a.startedAt) / 1000);
        lines.push('<span class="item bar-on">' + esc(a.provider + '/' + a.model) + '  ' + dur + 's  ' + esc(a.reqPreview) + '</span>');
      }
    }

    // ── 4. RECENT 10 ──
    if (recent.length) {
      lines.push('');
      lines.push('<span class="section">── recent ' + Math.min(recent.length, 10) + '/' + recent.length + ' ──</span>');
      for (let i = 0; i < Math.min(recent.length, 10); i++) {
        const r = recent[i];
        const cls = r.status < 400 ? 'ok' : 'err';
        const dur = Math.round((Date.now() - r.startedAt) / 1000);
        lines.push('<span class="item ' + cls + '">' + esc(r.provider + '/' + r.model)
          + '  ' + r.status + '  ' + dur + 's  '
          + esc(r.reqPreview.slice(0, 40)) + ' ... ' + esc(r.respPreview.slice(-40)) + '</span>');
      }
    }

    root.innerHTML = lines.length ? lines.join('\n') : '<span class="dim">(no activity)</span>';
  } catch(e) {
    root.innerHTML = '<span class="err">proxy unreachable</span>';
  }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
